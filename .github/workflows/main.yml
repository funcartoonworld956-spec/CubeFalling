name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev \
            cmake libssl-dev libjpeg-dev

          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Clean build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer android debug

      - name: Locate APK
        run: |
          mkdir -p bin
          APK=$(find .buildozer -type f -name "*.apk" | head -n 1)

          echo "FOUND APK: $APK"

          if [ -z "$APK" ]; then
            echo "BUILD FAILED"
            exit 1
          fi

          cp "$APK" bin/cubefalling.apk

      - name: Verify
        run: |
          ls -lah bin
          test -f bin/cubefalling.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CubeFalling-APK
          path: bin/cubefalling.apk
