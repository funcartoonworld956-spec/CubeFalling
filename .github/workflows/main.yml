name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev \
            cmake libssl-dev

          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build
        run: |
          rm -rf .buildozer bin
          buildozer android release

      - name: Copy APK
        run: |
          mkdir -p bin
          APK=$(find . -type f -name "*release*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          cp "$APK" ./bin/cubefalling-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CubeFalling-APK
          path: ./bin/cubefalling-release.apk
