name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3-dev zip unzip openjdk-17-jdk zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33 sh

    - name: Build APK
      run: |
        # Agar spec file nahi hai toh init karo
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # Gradle ko run karne ki permission dena (ZARURI STEP)
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Buildozer ko force karna ki wo permission fix kare
        yes | buildozer -v android debug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CubeFalling-APK
        path: bin/*.apk
