name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev \
            cmake libssl-dev

          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Clean
        run: rm -rf .buildozer bin

      - name: Build
        run: buildozer android release

      - name: Verify APK
        run: |
          echo "APK CHECK"
          find . -name "*.apk"

      - name: Create bin folder
        run: mkdir -p bin

      - name: Move APK
        run: |
          APK=$(find . -name "*.apk" | head -n 1)
          cp "$APK" bin/cubefalling-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CubeFalling
          path: bin/cubefalling-release.apk
