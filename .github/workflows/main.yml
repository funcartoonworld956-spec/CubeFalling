name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        # Humne gstreamer ko hata diya hai kyunki wo error de raha tha
        sudo apt-get install -y build-essential git python3-dev zip unzip openjdk-17-jdk zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33 sh

    - name: Build APK
      run: |
        # Agar spec file nahi hai toh naya banao
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        # Automatic yes for licenses
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-apk
        path: bin/*.apk
